name: CI
on:
  pull_request:
  push:
    branches: [main]

env:
  SENTRY_DISABLED: "1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded branch/PR runs, but let every main push finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        name: Classify documentation-only pull requests
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          if [[ "$EVENT" == pull_request ]]; then
            base=$(git merge-base "$BASE" "$HEAD")
            git diff --no-renames --name-only -z "$base" "$HEAD" > /tmp/changed-paths
            docs_only=true
            count=0
            while IFS= read -r -d '' path; do
              count=$((count + 1))
              case "$path" in
                doc/reports/examples/*) docs_only=false ;;
                doc/*.md|diary/*.md|.github/ISSUE_TEMPLATE/*.md|.github/PULL_REQUEST_TEMPLATE/*.md) ;;
                */*) docs_only=false ;;
                *.md) ;;
                *) docs_only=false ;;
              esac
            done < /tmp/changed-paths
            if [[ "$count" == 0 ]]; then docs_only=false; fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Documentation-only fast path: $docs_only" >> "$GITHUB_STEP_SUMMARY"

  docs:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Documentation formatting
        run: npx vp fmt --check

  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is omitted by owner decision (2026-11-13): it is expected to behave like Linux and
        # its hosted runners queue for long periods. Add it back only when explicitly requested.
        os: [ubuntu-latest, windows-latest]
        # Current Node LTS (doc/design/runtime.md, #108); update deliberately as LTS changes.
        node: [26]
    runs-on: ${{ matrix.os }}
    # Structured reports (#393, doc/design/test-reporting.md): each step runs through
    # scripts/ci-step.ts, which streams output unchanged, keeps the command's exit code and
    # records a bounded tail; tests also write JUnit. Bash on every OS, so the wrapper's `--`
    # separator reaches it intact on Windows.
    defaults:
      run:
        shell: bash
    env:
      PDB_PLATFORM: ${{ matrix.os }}, node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - id: install
        run: npm ci
      - name: check
        run: npx tsx scripts/ci-step.ts check -- npm run check
      - name: rule decisions
        run: npx tsx scripts/ci-step.ts rules -- npm run rules:test -- --junit reports/junit-rules.xml
      - name: rule outcome categories
        # #394: deliberately broken rule inputs (a wrong decision, malformed EDN, runner faults)
        # must each land in the right category. A demonstration, not production failures: it
        # fails only on a miscategorization, and writes its table to the step summary.
        run: npx tsx scripts/ci-step.ts rule-categories -- npx tsx scripts/rules-categories.ts
      - name: test
        # Naming reporters disables Vitest's automatic annotations, so github-actions is explicit.
        run: npx tsx scripts/ci-step.ts tests -- npx vp test run --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=reports/junit-tests.xml
      - name: build
        run: npx tsx scripts/ci-step.ts build -- npm run build
      - run: node --version
      - run: node dist/cli.mjs --help
      - run: npx tsx src/cli.ts --help
      - name: smoke
        run: npx tsx scripts/ci-step.ts smoke -- npm run smoke
      - name: smoke (source)
        run: npx tsx scripts/ci-step.ts smoke-source -- npx tsx scripts/smoke.ts src/cli.ts
      - name: package-test
        run: npx tsx scripts/ci-step.ts package-test -- npm run package-test
      - name: Test summary
        # Never makes the job green: fails only when a passing step left no (or a malformed) report.
        if: always() && steps.install.outcome == 'success'
        run: npx tsx scripts/test-summary.ts reports
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-node${{ matrix.node }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  # FreeBSD TRIAL (owner decision, 2026-11-13): exercises the runtime inside a FreeBSD VM on an
  # Ubuntu host. Deliberately NOT in `verify`'s needs, so a slow or broken VM cannot block merges.
  # Remove this job if it proves flaky, slow or costly to maintain.
  # Vite+ (vp: check/test/build) ships no FreeBSD binding, so `npm run check`, `npm test` and
  # `npm run build` cannot run there. dist/ is built on the Linux host and synced into the VM,
  # where npm lifecycle scripts (prepare -> vp, prepack -> build) are disabled; the VM then runs
  # the built CLI, the source CLI via tsx, both smoke tests and the installed-archive test.
  freebsd:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: test (freebsd 15.1, node 26) [trial, non-blocking]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test in FreeBSD VM
        # vmactions/freebsd-vm v1.6.0
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b
        env:
          npm_config_ignore_scripts: "true"
        with:
          release: "15.1"
          usesh: true
          sync: rsync
          envs: npm_config_ignore_scripts
          prepare: |
            pkg install -y git node26 npm-node26
          run: |
            set -e
            export SENTRY_DISABLED=1
            node --version
            npm --version
            npm ci
            node dist/cli.mjs --help
            npx tsx src/cli.ts --help
            npm run smoke
            npx tsx scripts/smoke.ts src/cli.ts
            npm run package-test

  # Single stable check name for branch protection and the triage tool's
  # required "verify" check; requires the selected docs or full-matrix path.
  verify:
    if: always()
    needs: [changes, docs, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected verification path to pass
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOCS: ${{ needs.docs.result }}
          TESTS: ${{ needs.test.result }}
        run: |
          set -eu
          test "$CLASSIFICATION" = success
          if [ "$DOCS_ONLY" = true ]; then
            test "$DOCS" = success && test "$TESTS" = skipped
          else
            test "$TESTS" = success && test "$DOCS" = skipped
          fi
